<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="manteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="100" height="100" rx="22" fill="url(#manteGrad)" />
  
  <!-- Outer Ring Accent -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Tool & Maintenance Glyph (Crossed Wrench & Screwdriver / Shield) -->
  <g transform="translate(50, 48) scale(0.92)" text-anchor="middle">
    <!-- Center Tool Symbol -->
    <path d="M-18,-18 C-10,-26 0,-22 4,-18 L18,-4 C22,0 26,10 18,18 C10,26 0,22 -4,18 L-18,4 C-22,0 -26,-10 -18,-18 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-16" cy="-16" r="5" fill="#10B981" />
    
    <!-- Spark / Energy Dot -->
    <circle cx="16" cy="16" r="4" fill="url(#accentGrad)" />
    
    <!-- Bold Inner Wrench Profile -->
    <path d="M-22,-6 L-6,-22 M-8,8 L18,34 M8,-8 L34,18" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  </g>
  
  <!-- Store Building / Roof Indicator -->
  <path d="M26,76 L50,62 L74,76 Z" fill="url(#accentGrad)" />
  <rect x="32" y="76" width="36" height="6" rx="2" fill="#FFFFFF" opacity="0.9" />
</svg>
